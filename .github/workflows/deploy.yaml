name: Deploy to GKE

on:
  push:
    branches: [ BE-GKE-Deployment ]

env:
  PROJECT_ID: sit-25t1-smishing-9b0e71f
  GKE_CLUSTER: smishing-cluster-central
  GKE_REGION: us-central1
  DEPLOYMENT_NAME: smishing-backend
  IMAGE: smishing-backend
  DOCKER_HUB_USERNAME: subhash707

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE }}:${{ github.sha }}
          ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        no-cache: true  # Force rebuild without cache