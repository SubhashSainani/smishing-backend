name: Deploy to Minikube

on:
  push:
    branches:
      - 'BE-docker-kubernetes-feature'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Mark runner directory as safe for Git
      run: git config --global --add safe.directory "C:/actions-runner/_work/smishing-backend/smishing-backend"

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set Execution Policy for PowerShell
      run: powershell -Command "Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process -Force"

    - name: Docker Info & Buildx Setup
      run: |
        docker info
        docker version
        docker buildx version

    - name: Set IMAGE_TAG
      run: echo "IMAGE_TAG=2017445/smishing-backend:${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: pwsh

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: 2017445
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and tag Docker image
      run: docker build -t $env:IMAGE_TAG .
      shell: pwsh

    - name: Push Docker image to Docker Hub
      run: docker push $env:IMAGE_TAG
      shell: pwsh

    - name: Load image into Minikube
      run: minikube image load $env:IMAGE_TAG
      shell: pwsh

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/smishing-backend-secrets.yaml
      shell: pwsh

    - name: Update image in deployment
      run: kubectl set image deployment/smishing-backend smishing-backend=$env:IMAGE_TAG
      shell: pwsh

    - name: Verify Deployment
      run: kubectl rollout status deployment/smishing-backend
      shell: pwsh

    - name: Check Minikube Status
      run: minikube status
      shell: pwsh
