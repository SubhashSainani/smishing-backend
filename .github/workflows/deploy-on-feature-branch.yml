name: Deploy to Minikube

on:
  push:
    branches:
      - 'BE-docker+kubernates-feature'  # exact match for your branch name

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u 2017445 --password-stdin

    - name: Build and tag Docker image
      run: |
        docker build -t 2017445/smishing-backend:latest .

    - name: Push Docker image to Docker Hub
      run: |
        docker push 2017445/smishing-backend:latest

    - name: Load image into Minikube
      run: |
        minikube image load 2017445/smishing-backend:latest

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/smishing-backend
