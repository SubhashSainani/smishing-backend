apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smishing-backend-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "smishing-backend-ip"
    networking.gke.io/load-balancer-type: "External"
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: smishing-backend-service
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: smishing-backend-service
            port:
              number: 80